<!doctype html>
<html lang="ht">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Kervens Louisinord</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #09090b; color: #fafafa; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(circle at top, #292524, #09090b 55%); }
      main { width: min(100%, 960px); margin: auto; padding: 56px 20px; }
      header { text-align: center; margin-bottom: 42px; }
      h1 { font-size: clamp(2.5rem, 8vw, 5.5rem); margin: 0; letter-spacing: -.06em; }
      p { color: #d6d3d1; line-height: 1.6; }
      .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; background: #1c1917; }
      .music { margin-top: 40px; padding: 24px; border: 1px solid #44403c; border-radius: 16px; background: rgba(28,25,23,.7); }
      .track + .track { margin-top: 22px; }
      h2, h3 { margin-top: 0; }
      audio { width: 100%; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Kervens Louisinord</h1>
        <p>Byenveni sou sit ofisyèl la.</p>
      </header>
      <section class="gallery" aria-label="Galri foto">
        <img src="30741F58-C0B1-4B13-BD16-8878D9E5EA3C.PNG" alt="Foto Kervens Louisinord" />
        <img src="4F13A903-F20D-4654-841B-BEC0C4C350CA.PNG" alt="Foto Kervens Louisinord" />
        <img src="6F8C8EB5-B287-4E8F-A4C1-78C2F72B5175.PNG" alt="Foto Kervens Louisinord" />
        <img src="80ABD1BA-BB67-43AD-B7BB-2E5C20470220.PNG" alt="Foto Kervens Louisinord" />
      </section>
      <section class="music" aria-label="Mizik">
        <h2>Mizik</h2>
        <div class="track">
          <h3>Pa banm dezòd</h3>
          <audio controls preload="metadata"><source src="pa_banm_dezod_preview_18s_from_12s.mp3" type="audio/mpeg" /></audio>
        </div>
        <div class="track">
          <h3>Side comfort</h3>
          <audio controls preload="metadata"><source src="side_comfort_preview_18s_from_12s.mp3" type="audio/mpeg" /></audio>
        </div>
      </section>
    </main>
  </body>
</html>
